services:
  - type: web
    name: codex-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false        # Enter this manually in the Render dashboard
      - key: CORS_ORIGINS
        sync: false        # Optional: add your custom domain here later
